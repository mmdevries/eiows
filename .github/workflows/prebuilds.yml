name: Prebuilds

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the assembled package to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} / ${{ matrix.libc }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            libc: glibc
            runner: ubuntu-24.04
            image: node:22-bullseye
            prepare: apt-get update && apt-get install -y --no-install-recommends g++ make python3 zlib1g-dev
          - arch: arm64
            libc: glibc
            runner: ubuntu-24.04-arm
            image: node:22-bullseye
            prepare: apt-get update && apt-get install -y --no-install-recommends g++ make python3 zlib1g-dev
          - arch: x64
            libc: musl
            runner: ubuntu-24.04
            image: node:22-alpine
            prepare: apk add --no-cache g++ make python3 zlib-dev
          - arch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            image: node:22-alpine
            prepare: apk add --no-cache g++ make python3 zlib-dev
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify prebuild
        env:
          IMAGE: ${{ matrix.image }}
          PREPARE: ${{ matrix.prepare }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env PREPARE \
            "$IMAGE" \
            sh -c '$PREPARE && npm ci --ignore-scripts && npm run prebuildify -- --tag-libc && PREBUILDS_ONLY=1 npm test'
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: prebuilds
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prebuildify
      - name: Verify prebuild
        run: PREBUILDS_ONLY=1 npm test
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-darwin-${{ matrix.arch }}
          path: prebuilds
          if-no-files-found: error

  freebsd:
    name: FreeBSD ${{ matrix.node_arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm_arch: x86_64
            node_arch: x64
          - vm_arch: aarch64
            node_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify prebuild
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          arch: ${{ matrix.vm_arch }}
          usesh: true
          prepare: pkg install -y node24 npm-node24 python3
          run: |
            npm ci --ignore-scripts
            npm run prebuildify
            PREBUILDS_ONLY=1 npm test
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-freebsd-${{ matrix.node_arch }}
          path: prebuilds
          if-no-files-found: error

  package:
    name: Assemble npm package
    needs: [linux, macos, freebsd]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true
      - name: Validate prebuild set
        run: |
          test -f prebuilds/linux-x64/eiows.glibc.node
          test -f prebuilds/linux-x64/eiows.musl.node
          test -f prebuilds/linux-arm64/eiows.glibc.node
          test -f prebuilds/linux-arm64/eiows.musl.node
          test -f prebuilds/darwin-x64/eiows.node
          test -f prebuilds/darwin-arm64/eiows.node
          test -f prebuilds/freebsd-x64/eiows.node
          test -f prebuilds/freebsd-arm64/eiows.node
          find prebuilds -type f -name '*.node' -print
      - name: Pack module
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: eiows-*.tgz
          if-no-files-found: error

  verify-node:
    name: Package / Node ${{ matrix.node }} / Linux ${{ matrix.libc }} x64
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            libc: glibc
            image_suffix: bullseye
          - node: 22
            libc: musl
            image_suffix: alpine
          - node: 24
            libc: glibc
            image_suffix: bullseye
          - node: 24
            libc: musl
            image_suffix: alpine
          - node: 26
            libc: glibc
            image_suffix: bullseye
          - node: 26
            libc: musl
            image_suffix: alpine
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - name: Install without compilation and load native addon
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/package" \
            --workdir /package \
            "node:${{ matrix.node }}-${{ matrix.image_suffix }}" \
            sh -c 'mkdir smoke && cd smoke && npm init -y >/dev/null && npm install --ignore-scripts ../eiows-*.tgz && node -e "const e = require(\"eiows\"); const s = e.native.createSession(0, 1024, \"\")[0]; e.native.dispose(s)"'

  publish:
    name: Publish to npm
    needs: verify-node
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - name: Verify release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const expected = require('./package.json').version; const actual = process.env.RELEASE_TAG.replace(/^v/, ''); if (actual !== expected) throw new Error('tag ' + actual + ' does not match package version ' + expected)"
      - run: npm publish eiows-*.tgz --access public --provenance
